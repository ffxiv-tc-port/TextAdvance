Functions==功能
Automatic quest accept (QA)==自動接取任務 (QA)
Automatically accepts new quests when talking to quest initiating NPC==與可觸發任務的 NPC 交談時自動接取新任務
Automatic quest complete (QC)==自動完成任務 (QC)
Automatically completes quests when talking to NPC that completes quest==與可完成任務的 NPC 交談時自動完成任務
Automatic reward pick (RP)==自動選擇獎勵 (RP)
Automatically picks quest completion reward based on simple rules that are configured below==根據下方設定的簡單規則自動選擇任務完成獎勵
Automatic talk skip (TS)==自動跳過對話 (TS)
Automatically advances most of the subtitles. Some subtitles may only be advanced manually still.==自動推進大部分字幕。部分字幕可能仍需手動推進。
Auto-confirm request handins (RH)==自動確認交付請求 (RH)
Automatically confirms most of item requests once filled. Some requests may not be automatically confirmed.==物品請求填滿後自動確認大部分請求。部分請求可能無法自動確認。
Automatic request fill (RF)==自動填充請求 (RF)
Automatically fills item request window. Some requests may not be automatically filled.==自動填充物品請求視窗。部分請求可能無法自動填充。
Automatic ESC press during cutscene (CS)==過場動畫時自動按下 ESC (CS)
Automatically presses ESC key during cutscene when cutscene is skippable. Does not skips normally unskippable cutscenes.==當過場動畫可跳過時自動按下 ESC 鍵。不會跳過原本無法跳過的過場動畫。
Automatic cutscene skip confirmation (CC)==自動確認跳過過場動畫 (CC)
Automatically confirms cutscene skips upon pressing ESC.==按下 ESC 後自動確認跳過過場動畫。
Automatic interaction with quest-related object (IN)==自動與任務相關物件互動 (IN)
Automatically interacts with nearby quest-related NPCs and objects.==自動與附近的任務相關 NPC 及物件互動。
