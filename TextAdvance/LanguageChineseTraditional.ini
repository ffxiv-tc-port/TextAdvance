TextAdvance: ==TextAdvance：
paused externally==已被外部暫停
Right click to stop all tasks==按右鍵可停止所有任務
Filling in request.==正在填充請求。
This can take couple seconds. If this process is stuck, please click the button below.==這可能需要幾秒鐘。若此程序卡住，請點擊下方按鈕。
Cancel==取消
toggles TextAdvance plugin.\n/at y|yes|e|enable - turns on TextAdvance.\n/at n|no|d|disable - turns off TextAdvance.\n/at c|config|s|settings - opens TextAdvance settings.\n/at g - toggles visual quest target markers\n/at mtq - move to the first available quest location, if present (requires navmesh integration to be enabled)\n/at mtqstop - cancel all pending movement tasks\n/at mtf - move to flag==切換 TextAdvance 插件開關。\n/at y|yes|e|enable - 啟用 TextAdvance。\n/at n|no|d|disable - 停用 TextAdvance。\n/at c|config|s|settings - 開啟 TextAdvance 設定。\n/at g - 切換任務目標的視覺標記\n/at mtq - 移動到第一個可用的任務地點(需先啟用 navmesh 整合)\n/at mtqstop - 取消所有待處理的移動任務\n/at mtf - 移動到地圖標記位置
